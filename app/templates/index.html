<!doctype html>
<html>

<head>
    <title> Ender 3 Controll</title>
    <meta name="viewport" content="width = device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/style/button_style.css">
    <link rel="stylesheet" href="../static/style/style.css">
</head>

<body>
    <div class="container">
        <div style="position:absolute;">

            <button class="Button-4" onclick="logout()">Log out</button>
            <a href="/login"">

                <button class="Button-4" style="padding-left: 5px;">Log in</button>
            </a>
        </div>
        <div class="controll_container">
            <h1>Hellooooo, Miguel!</h1>

            <button class="button-4" onclick="reconnect_printer()">PReconnect printer</button>
            <button class="button-4" onclick="sendCommand('G28')">Printer Home</button>
            <button class="button-4" onclick="sendCommand('M105')">Get Temp</button>
            <button class="button-4" onclick="updatePrinterState()">printer status</button>

            <div>
                <h3>X</h3>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 X-10 F300', 'G90'])">left</button>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 X10 F300', 'G90'])">right</button>
                <h3>Y</h3>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 Y10 F300', 'G90'])">front</button>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 Y-10 F300', 'G90'])">back</button>
                <h3>Z</h3>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 Z10 F300', 'G90'])">up</button>
                <button class="button-4" onclick="sendCommand(['G91', 'G1 Z-10 F300', 'G90'])">down</button>
            </div>
        </div>
        <div class="status_container">
            <h3>Status:</h3>
            <pre id="status"></pre>

            <h3>Response:</h3>
            <pre id="response"></pre>
        </div>
        <div class="camera_container">
            <h2>Camera Feed:</h2>
            <button class="button-4" onclick="toggleCam()">swich cam</button>
            <img id="bg" src="/api/camera/video_feed" style="width: 80%; height:80%;">
        </div>
    </div>
    <script src="/static/logout.js"></script>
    <script src="/static/printer.js"></script>
    <script src="/static/camera.js"></script>


</body>

</html>
